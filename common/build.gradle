architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // Necessario so para compilar contra as classes do Minecraft (nao e o loader em runtime)
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // GeckoLib: o artefato fabric serve como API de compilacao para o modulo comum
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
}
